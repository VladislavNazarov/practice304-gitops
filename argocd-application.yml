apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: practice304-gitops
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/VladislavNazarov/practice304-gitops.git
    targetRevision: main
    path: practice304
    helm:
      releaseName: practice304-gitops

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
